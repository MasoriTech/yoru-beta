<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Yoru</title>
<style>
  :root { --bg: #0b0907; --card: #17110d; --card-hi: #211710; --line: #35261a; --orange: #ff7a2e; --orange-soft: rgba(255,122,46,.14);
    --text: #f4ece4; --muted: #b7a898; --dim: #8a7b6c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  body { display: flex; align-items: center; padding: 0 48px; -webkit-font-smoothing: antialiased; background:
    radial-gradient(760px 460px at 98% 100%, rgba(255,122,46,.30), transparent 62%),
    radial-gradient(520px 320px at 0% 0%, rgba(255,122,46,.10), transparent 70%), var(--bg); }
  /* a direita fica livre para o avatar, que aparece por cima desta janela */
  main { width: 100%; max-width: 560px; animation: rise .5s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { main, .card, .go { animation: none !important; transition: none !important; } }

  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .brand img { width: 56px; height: 56px; border-radius: 15px; box-shadow: 0 0 0 1px var(--line), 0 6px 22px rgba(255,122,46,.28); }
  .brand b { display: block; font-size: 32px; line-height: 1; letter-spacing: 7px; font-weight: 700; }
  .brand small { display: block; font-size: 10px; letter-spacing: 3.2px; color: var(--muted); margin-top: 6px; }

  h1 { font-size: 24px; margin: 0 0 4px; font-weight: 650; letter-spacing: .2px; }
  h1 em { font-style: normal; color: var(--orange); }
  .lead { margin: 0 0 18px; color: var(--muted); font-size: 15px; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
  .card { position: relative; display: flex; align-items: center; gap: 12px; text-align: left; min-height: 70px; padding: 12px 14px;
    background: linear-gradient(180deg, var(--card-hi), var(--card)); border: 1px solid var(--line); border-radius: 14px; color: var(--text);
    font: inherit; cursor: pointer; transition: border-color .15s, transform .15s, box-shadow .15s, background .15s; animation: rise .5s ease-out both; }
  .card:nth-child(2) { animation-delay: .06s; } .card:nth-child(3) { animation-delay: .12s; } .card:nth-child(4) { animation-delay: .18s; }
  .card:hover, .card:focus-visible { border-color: var(--orange); outline: none; transform: translateY(-2px); box-shadow: 0 8px 22px rgba(255,122,46,.16), 0 0 0 1px var(--orange) inset; }
  .card:active { transform: translateY(0); }
  .ico { flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--orange-soft); color: var(--orange); }
  .ico svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .txt { flex: 1; min-width: 0; line-height: 1.25; }
  .txt b { display: block; font-size: 14px; font-weight: 600; }
  .txt span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .txt b .tag { display: inline-block; margin-top: 0; font-size: 9.5px; letter-spacing: .6px; text-transform: uppercase; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: 1px; font-weight: 500; color: var(--dim); }
  .arrow { flex: none; width: 16px; height: 16px; fill: none; stroke: var(--dim); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s, stroke .15s; }
  .card:hover .arrow, .card:focus-visible .arrow { stroke: var(--orange); transform: translateX(3px); }

  .actions { display: flex; align-items: center; gap: 16px; }
  .go { display: inline-flex; align-items: center; gap: 10px; background: var(--orange); border: 0; color: #1a0e05; font: inherit; font-weight: 700; font-size: 15px;
    padding: 12px 30px; border-radius: 11px; cursor: pointer; box-shadow: 0 8px 22px rgba(255,122,46,.30); transition: filter .15s, transform .15s; }
  .go:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .go:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .go svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .hint { color: var(--dim); font-size: 12px; line-height: 1.35; max-width: 320px; }

  @media (max-height: 500px) { .lead { margin-bottom: 12px; } .brand { margin-bottom: 12px; } .card { min-height: 62px; padding: 9px 12px; } .grid { margin-bottom: 14px; } }
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="../assets/icon.png" alt="" />
    <div><b>YORU</b><small>PERSONAL AI COMPANION</small></div>
  </div>
  <h1><span id="hello">Olá</span>! Eu sou a <em>Yoru</em>. ✨</h1>
  <p class="lead">Vamos configurar sua experiência? Escolha por onde começar:</p>
  <div class="grid">
    <button class="card" data-tab="perfil">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16.4c.6-1.5 1.8-2.2 3.2-2.2s2.6.7 3.2 2.2M14.5 10h3.5M14.5 13.5h3.5"/></svg></span>
      <span class="txt"><b>Seu Perfil<span class="tag">opcional</span></b><span>Nome, apelido e foto</span></span>
      <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="card" data-tab="ia">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg></span>
      <span class="txt"><b>Preferências da IA</b><span>Provedor, modelo e chave</span></span>
      <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="card" data-tab="voz">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"/></svg></span>
      <span class="txt"><b>Modelos e Voz</b><span>Voz da Yoru: Francisca</span></span>
      <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="card" data-tab="avatar">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3.2"/><path d="M5.5 20c.4-3.9 3-6.2 6.5-6.2s6.1 2.3 6.5 6.2"/></svg></span>
      <span class="txt"><b>Avatar (VRM)</b><span>Modelo, tamanho e itens</span></span>
      <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="actions">
    <button class="go" id="go">Começar <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <span class="hint">Dá para mudar tudo depois, no painel da Yoru.</span>
  </div>
</main>
<script src="./welcome.js"></script>
</body>
</html>
